# Reference/recreation manifest: live previews were created via MCP, not a Blueprint.
# Review adoption before applying; HTTP checks/shutdown target below are not yet applied.
# Free development preview only; retain Supabase for Auth, database and storage.
# Use the two assigned public HTTPS origins, never Render private hostnames.
# Keep collection closed and paid upgrades deferred.
services:
  - type: web
    name: peekalo-dev
    runtime: docker
    branch: codex/free-render-preview
    region: singapore
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 120
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SHARE_TOKEN_SECRET
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: WAITLIST_ENABLED
        value: "false"
  - type: web
    name: peekalo-site-dev
    runtime: docker
    branch: codex/free-render-preview
    region: singapore
    plan: free
    numInstances: 1
    dockerfilePath: ./apps/site/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PUBLIC_APP_URL
        sync: false
      - key: PUBLIC_SITE_URL
        sync: false
      - key: WAITLIST_ENABLED
        value: "false"
